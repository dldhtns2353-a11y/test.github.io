<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한라대학교 - 날씨 & 명언</title>
  <link rel="icon" href="assets/halla-symbol.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 컨트롤 (다크/라이트 모드 토글) -->
  <header class="header">
    <div class="header-right">
      <button id="theme-toggle" class="icon-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
        <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="main-content">
    <!-- 1. 한라대학교 공식 로고 (클릭 시 홈페이지 연결) -->
    <div class="logo-container">
      <a href="https://www.halla.ac.kr" target="_blank" rel="noopener noreferrer" class="halla-hero-link" title="원주 한라대학교 공식 홈페이지 바로가기">
        <div class="halla-logo-wrapper">
          <img src="assets/halla-symbol.png" alt="한라대학교 심볼" class="halla-hero-symbol">
          <div class="halla-text-box">
            <span class="halla-title-ko">한라대학교</span>
            <span class="halla-title-en">HALLA UNIVERSITY</span>
          </div>
        </div>
      </a>
    </div>

    <!-- 2. 날씨 섹션: 원주, 서울, 제주 -->
    <section class="weather-section">
      <div class="section-title">
        <span>오늘의 날씨</span>
        <button id="refresh-weather" class="refresh-btn" title="날씨 새로고침">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="weather-grid" id="weather-grid">
        <!-- 원주 카드 -->
        <div class="weather-card" id="weather-wonju">
          <div class="card-header">
            <span class="city-name">원주</span>
            <span class="city-badge">Wonju</span>
          </div>
          <div class="card-body">
            <div class="weather-icon-wrapper" id="wonju-icon">
              <span class="loading-spinner"></span>
            </div>
            <div class="weather-temp-info">
              <span class="temp-val" id="wonju-temp">--°C</span>
              <span class="weather-desc" id="wonju-desc">불러오는 중...</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="humidity-val" id="wonju-humidity">습도: --%</span>
            <span class="wind-val" id="wonju-wind">풍속: -- m/s</span>
          </div>
        </div>

        <!-- 서울 카드 -->
        <div class="weather-card" id="weather-seoul">
          <div class="card-header">
            <span class="city-name">서울</span>
            <span class="city-badge">Seoul</span>
          </div>
          <div class="card-body">
            <div class="weather-icon-wrapper" id="seoul-icon">
              <span class="loading-spinner"></span>
            </div>
            <div class="weather-temp-info">
              <span class="temp-val" id="seoul-temp">--°C</span>
              <span class="weather-desc" id="seoul-desc">불러오는 중...</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="humidity-val" id="seoul-humidity">습도: --%</span>
            <span class="wind-val" id="seoul-wind">풍속: -- m/s</span>
          </div>
        </div>

        <!-- 제주 카드 -->
        <div class="weather-card" id="weather-jeju">
          <div class="card-header">
            <span class="city-name">제주</span>
            <span class="city-badge">Jeju</span>
          </div>
          <div class="card-body">
            <div class="weather-icon-wrapper" id="jeju-icon">
              <span class="loading-spinner"></span>
            </div>
            <div class="weather-temp-info">
              <span class="temp-val" id="jeju-temp">--°C</span>
              <span class="weather-desc" id="jeju-desc">불러오는 중...</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="humidity-val" id="jeju-humidity">습도: --%</span>
            <span class="wind-val" id="jeju-wind">풍속: -- m/s</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 오늘의 명언 섹션 -->
    <section class="quote-section">
      <div class="quote-card">
        <div class="quote-badge">오늘의 명언</div>
        <p class="quote-text" id="quote-text">생각하는 대로 살지 않으면 사는 대로 생각하게 된다.</p>
        <p class="quote-author" id="quote-author">— 폴 부르제</p>
        <button id="next-quote" class="next-quote-btn" title="새로운 명언 보기">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
          다른 명언
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
